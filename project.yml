# XcodeGen spec. Run `xcodegen generate` to create Habituate.xcodeproj.
name: Habituate
options:
  bundleIdPrefix: com.habituate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple team here (or in Xcode › Signing & Capabilities) to run on a real iPhone.
    DEVELOPMENT_TEAM: ""

targets:
  Habituate:
    type: application
    platform: iOS
    sources:
      - path: Habituate
    settings:
      base:
        PRODUCT_NAME: Habituate
        PRODUCT_BUNDLE_IDENTIFIER: com.habituate.app
        INFOPLIST_FILE: Config/Habituate-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Habituate.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: HabituateWidget

  HabituateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HabituateWidget
      - path: Habituate/Models
      - path: Habituate/Views/Components/HabitIcon.swift
    settings:
      base:
        PRODUCT_NAME: HabituateWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.habituate.app.widget
        INFOPLIST_FILE: Config/HabituateWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/HabituateWidget.entitlements
        SKIP_INSTALL: YES

  HabituateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabituateTests
    dependencies:
      - target: Habituate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.habituate.app.tests

  HabituateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HabituateUITests
    dependencies:
      - target: Habituate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.habituate.app.uitests
        TEST_TARGET_NAME: Habituate

schemes:
  Habituate:
    build:
      targets:
        Habituate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HabituateTests
        - HabituateUITests
